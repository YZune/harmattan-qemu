name: Host tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install framebuffer test dependency
        run: python3 -m pip install 'Pillow>=10,<13'
      - name: Check published files and documentation links
        run: python3 scripts/check-public-tree.py
      - name: Shell syntax
        run: |
          git ls-files '*.sh' | while IFS= read -r script; do
            sh -n "$script" || exit 1
          done
      - name: Host regression suite
        run: python3 -B -m unittest discover -s scripts/harmattan-qemu/tests -p 'test_*.py' -v

  native-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official Godot
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  godot.zip' | sha512sum --check --strict
          unzip -q godot.zip
          echo "HARMATTAN_GODOT=$RUNNER_TEMP/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Native frontend protocol and lifecycle regression
        run: python3 -B -m unittest discover -s scripts/harmattan-qemu/tests -p 'test_linux_frontend.py' -v
