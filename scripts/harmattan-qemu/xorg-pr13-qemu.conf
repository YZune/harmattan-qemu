Section "ServerLayout"
    Identifier  "QEMU Layout"
    Screen      0 "Default Screen"
    InputDevice "Atmel mXT Touchscreen" "CorePointer"
EndSection

Section "ServerFlags"
    # The rescue boot does not run udevd, so bind the emulated touchscreen
    # explicitly instead of waiting for Xorg hotplug discovery.
    Option "AutoAddDevices" "false"
EndSection

Section "Module"
    Disable "dri2"
EndSection

Section "Monitor"
    Identifier "Configured Monitor"
EndSection

Section "Screen"
    Identifier "Default Screen"
    Device     "Configured Video Device"
EndSection

Section "Device"
    Identifier "Configured Video Device"
    Driver     "omapfb"
    Option     "fb" "/dev/fb0"
EndSection

Section "InputDevice"
    Identifier "Atmel mXT Touchscreen"
    Driver     "mtev"
    Option     "Device" "/dev/input/qemu-touchscreen"
    Option     "CorePointer"
EndSection
